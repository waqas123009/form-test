<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FormInsight Ultimate Test Suite</title>

    <!-- 🚨 FormInsight God-Tier Tracker (Via Tailscale) 🚨 -->
    <script 
        src="https://gh-runner-1.tail6a428c.ts.net/static/tracker.js" 
        data-account-id="client_omega_001" 
        data-config='{"surveys":true,"coBrowse":true,"predictiveInterception":true,"stateTelemetry":true,"strictMasking":false}'>
    </script>

    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f8fafc; display: flex; justify-content: center; padding: 40px 20px; color: #0f172a; }
        .form-card { background: white; width: 100%; max-width: 500px; padding: 40px; border-radius: 16px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04); }
        
        /* Progress Bar */
        .progress-bar { display: flex; justify-content: space-between; margin-bottom: 30px; position: relative; }
        .progress-bar::before { content: ''; position: absolute; top: 14px; left: 0; width: 100%; height: 2px; background: #e2e8f0; z-index: 1; }
        .step-indicator { width: 30px; height: 30px; border-radius: 50%; background: #e2e8f0; color: #64748b; display: flex; justify-content: center; align-items: center; font-weight: bold; z-index: 2; border: 4px solid white; transition: all 0.3s; }
        .step-indicator.active { background: #3b82f6; color: white; }
        .step-indicator.completed { background: #10b981; color: white; }

        /* Form Steps */
        .step { display: none; animation: fadeIn 0.4s ease; }
        .step.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        h2 { margin: 0 0 5px 0; font-size: 24px; }
        p.subtitle { color: #64748b; font-size: 14px; margin: 0 0 25px 0; }

        label { display: block; font-size: 13px; font-weight: 700; color: #475569; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        input, select { width: 100%; padding: 14px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 15px; box-sizing: border-box; margin-bottom: 20px; transition: border-color 0.2s; background: #f8fafc; }
        input:focus, select:focus { border-color: #3b82f6; outline: none; background: white; }
        
        .error-message { color: #dc2626; font-size: 13px; font-weight: bold; margin-top: -15px; margin-bottom: 20px; display: none; background: #fef2f2; padding: 10px; border-radius: 6px; border-left: 4px solid #dc2626; }
        
        /* Buttons */
        .btn-container { display: flex; gap: 15px; margin-top: 20px; }
        button { flex: 1; padding: 14px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; border: none; transition: transform 0.1s; }
        button:active { transform: scale(0.98); }
        .btn-next { background: #0f172a; color: white; }
        .btn-prev { background: #f1f5f9; color: #475569; }
        .btn-submit { background: #10b981; color: white; }

        /* Dead Click Target */
        .fake-promo-btn { display: inline-block; background: #fef3c7; color: #d97706; padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-bottom: 20px; cursor: default; user-select: none; }
    </style>
</head>
<body>

    <div class="form-card">
        <div class="progress-bar">
            <div class="step-indicator active" id="ind-1">1</div>
            <div class="step-indicator" id="ind-2">2</div>
            <div class="step-indicator" id="ind-3">3</div>
        </div>

        <form id="multi-step-form" novalidate onsubmit="event.preventDefault(); alert('Success! Data submitted.');">
            
            <!-- STEP 1: IDENTITY & PHONE HEALING -->
            <div class="step active" id="step-1">
                <h2>Personal Details</h2>
                <p class="subtitle">Triggers Identity Hunter & Phone Auto-Heal</p>

                <label>Full Name</label>
                <input type="text" name="full_name" placeholder="E.g. Elon Musk">

                <label>Work Email</label>
                <input type="email" name="work_email" placeholder="elon@spacex.com" required>
                <div class="error-message" id="email-error"></div> <!-- Error Scraper Target -->

                <label>Phone Number (Strict)</label>
                <input type="tel" name="phone_number" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" placeholder="Format: 555-123-4567">

                <div class="btn-container">
                    <button type="button" class="btn-next" onclick="nextStep(2, '/setup')">Next Step ➔</button>
                </div>
            </div>

            <!-- STEP 2: PASSWORD & DROPDOWN HEALING -->
            <div class="step" id="step-2">
                <h2>Account Setup</h2>
                <p class="subtitle">Triggers Password Relaxer & Dropdown Morph</p>

                <label>Secure Password</label>
                <!-- Strict pattern requiring uppercase, lowercase, number, symbol, 8+ chars -->
                <input type="password" id="strict-password" name="account_password" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[!@#$%^&*]).{8,}" placeholder="••••••••" required>

                <label>Select Subscription Tier</label>
                <select name="subscription_tier" id="sub-tier">
                    <option value="">-- Choose a plan --</option>
                    <option value="startup">Startup ($49/mo)</option>
                    <option value="growth">Growth ($149/mo)</option>
                    <option value="enterprise">Enterprise ($499/mo)</option>
                </select>

                <div class="btn-container">
                    <button type="button" class="btn-prev" onclick="nextStep(1, '/personal')">⬅ Back</button>
                    <button type="button" class="btn-next" onclick="nextStep(3, '/checkout')">Continue to Payment ➔</button>
                </div>
            </div>

            <!-- STEP 3: RAGE CLICKS & INTERCEPTION -->
            <div class="step" id="step-3">
                <h2>Final Checkout</h2>
                <p class="subtitle">Triggers Rage Clicks & Promo Interception</p>

                <!-- Dead Click Target (Looks like a button, acts like text) -->
                <div class="fake-promo-btn">🎁 Have a Promo Code? Apply it below!</div>

                <label>Promo / Discount Code</label>
                <input type="text" name="promo_code" id="promo-code" placeholder="Enter code here...">

                <div class="btn-container">
                    <button type="button" class="btn-prev" onclick="nextStep(2, '/setup')">⬅ Back</button>
                    <button type="submit" class="btn-submit">Complete Order 💳</button>
                </div>
            </div>

        </form>
    </div>

    <script>
        // Simulate URL changes for the Multi-Step Funnel Analytics
        window.history.replaceState(null, null, '/personal');

        function nextStep(stepNumber, simulatedUrl) {
            // 1. Hide all steps
            document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.step-indicator').forEach(el => {
                el.classList.remove('active');
                if (parseInt(el.innerText) < stepNumber) el.classList.add('completed');
                else el.classList.remove('completed');
            });

            // 2. Show requested step
            document.getElementById(`step-${stepNumber}`).classList.add('active');
            document.getElementById(`ind-${stepNumber}`).classList.add('active');

            // 3. 🚨 MAGIC TRICK: Update URL without reloading to trigger FormInsight Funnels
            window.history.pushState(null, null, simulatedUrl);
            
            // Tell tracker to check for new URL (if visitedUrls array is listening)
            if (window.FormInsight && window.FormInsight.track) {
                window.FormInsight.track('Funnel Step Reached', { step: stepNumber, url: simulatedUrl });
            }
        }

        // Custom Error Simulator (To test the UI Error Scraper)
        document.querySelector('input[name="work_email"]').addEventListener('blur', function(e) {
            const errorBox = document.getElementById('email-error');
            if (e.target.value && !e.target.value.includes('@')) {
                errorBox.innerText = "Error: Invalid email format. Missing '@' symbol.";
                errorBox.style.display = 'block';
            } else {
                errorBox.style.display = 'none';
            }
        });
    </script>
</body>
</html>
